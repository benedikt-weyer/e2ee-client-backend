name: Release npm Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment to apply from the latest tag
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: e2ee-client-backend-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute next release version
        id: version
        run: |
          next_version="$(./scripts/next-version.sh "${{ inputs.bump }}")"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Commit release version
        run: |
          git add package.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"

      - name: Create git tag
        run: git tag "${{ steps.version.outputs.tag }}"

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish-npm.sh

      - name: Push release commit and tag
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ steps.version.outputs.tag }}"